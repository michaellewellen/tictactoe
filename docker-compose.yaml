services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  site-ui:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    depends_on:
      - db
    volumes:
      - .:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=appdb;Username=appuser;Password=appsecret
    command: >
      sh -c "dotnet restore && dotnet watch run --urls http://0.0.0.0:8080"
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true

volumes:
  pgdata: